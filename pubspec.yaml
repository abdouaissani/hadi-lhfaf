name: LHadi_Coiffure
description: تطبيق حجز أدوار الحلاق
publish_to: "none"

version: 1.0.0+8

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Icons
  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.9.1

  # Local storage
  shared_preferences: ^2.5.3

  # Firebase
  firebase_core: ^4.0.0
  firebase_messaging: ^16.0.0

  # AdMob
  google_mobile_ads: ^7.0.0

  # Local notifications
  flutter_local_notifications: 17.2.4

  # Fingerprint / Face ID
  local_auth: ^3.0.2

  # OpenStreetMap
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # App Icon
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# =========================================================
# APP ICON
# =========================================================

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21